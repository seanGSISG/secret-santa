<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>New wishlist item from {{gifteeName}}! 🎁</title>
  </head>

    <h2 style="color: #1a472a;">Hello {{santaName}}! 🦌</h2>

</html>
