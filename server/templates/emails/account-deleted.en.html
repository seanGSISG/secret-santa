<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Your Secret Santa account has been deleted</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background-color: #f5f0eb; font-family: Arial, sans-serif; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgba(26, 71, 42, .12);">
      <div style="padding: 28px 32px; background: linear-gradient(135deg, #1a472a, #2d5a3d); color: #fff; text-align: center;">
        <div style="font-size: 40px;">🎄</div>
        <h1 style="margin: 10px 0 0; font-size: 26px;">Sorry to see you go, {{name}}…</h1>
      </div>
      <div style="padding: 32px;">
        <p style="font-size: 17px; line-height: 1.6;">Your account has been deleted. This confirms that you are no longer participating in the gift draw.</p>
        <div style="margin: 24px 0; padding: 18px; border-left: 4px solid #c41e3a; background: #fff7f7; line-height: 1.6;">
          This is the last email you will receive from us.
        </div>
        <p style="color: #666; line-height: 1.6;">Thank you for being part of our Secret Santa. We wish you a wonderful holiday season!</p>
        <p style="margin-top: 28px; color: #1a472a; font-weight: bold;">The Secret Santa team 🎅</p>
      </div>
    </div>
  </body>
</html>
